<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>{{TITLE}}</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body class="with-nav">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><rect x="7" y="8" width="18" height="4" rx="2" fill="var(--bg)"/><rect x="7" y="14" width="12" height="4" rx="2" fill="var(--bg)"/><rect x="7" y="20" width="15" height="4" rx="2" fill="var(--bg)"/></svg>
      <h1 id="siteTitle">{{TITLE}}</h1>
      <a id="headStatus" class="head-status" href="#alerts" hidden></a>
    </div>
    <nav class="actions">
      <span id="updated" class="muted small"></span>
      <button id="themeBtn" class="icon-btn" type="button" title="Switch light / dark" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
    </nav>
  </header>

  <div class="shell">
    <nav id="sidenav" class="sidenav" aria-label="Sections">
      <a href="#overview" data-view="overview"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span><span class="nl">Overview</span><span class="nb" data-badge="overview"></span></a>
      <a href="#updates" data-view="updates"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span><span class="nl">Updates</span><span class="nb" data-badge="updates"></span></a>
      <a href="#network" data-view="network"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-2h12v2"/></svg></span><span class="nl">Network</span><span class="nb" data-badge="network"></span></a>
      <a href="#email" data-view="email"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><span class="nl">Email</span><span class="nb" data-badge="email"></span></a>
      <a href="#news" data-view="news"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12v16H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1z"/><path d="M17 8h3v10a2 2 0 0 1-2 2M8 8h5M8 12h5M8 16h3"/></svg></span><span class="nl">News</span><span class="nb" data-badge="news"></span></a>
      <a href="#sites" data-view="sites"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><span class="nl">Sites</span><span class="nb" data-badge="sites"></span></a>
      <a href="#alerts" data-view="alerts"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></span><span class="nl">Alerts</span><span class="nb" data-badge="alerts"></span></a>
      <a href="#clients" data-view="clients"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span class="nl">Clients</span><span class="nb" data-badge="clients"></span></a>
    </nav>

    <main id="app">
      <p id="error" class="overall bad" hidden></p>
      <section class="view" data-view="overview" hidden><div id="v-overview"></div></section>
      <section class="view" data-view="updates" hidden><div id="v-updates"></div></section>
      <section class="view" data-view="network" hidden><div id="v-network"></div></section>
      <section class="view" data-view="email" hidden><div id="v-email"></div></section>
      <section class="view" data-view="news" hidden><div id="v-news"></div></section>
      <section class="view" data-view="sites" hidden><div id="v-sites"></div></section>
      <section class="view" data-view="alerts" hidden><div id="v-alerts"></div></section>
      <section class="view" data-view="clients" hidden><div id="v-clients"></div></section>
    </main>
  </div>
</body>
</html>
